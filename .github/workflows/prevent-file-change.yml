---
name: 'Prevent file change'

# Triggers intentionally disabled for Argus-OSS-Security.
# "on":
#   pull_request_target:
#     branches: [main]
# 
jobs:
  prevent-file-change:
    uses: sous-chefs/.github/.github/workflows/prevent-file-change.yml@9.0.1
    permissions:
      pull-requests: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
